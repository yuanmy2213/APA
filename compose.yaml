services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - review-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U review -d review]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - 127.0.0.1:8080:8080
    environment:
      DB_URL: jdbc:postgresql://db:5432/review
      DB_USER: review
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      CONTEXT_PATH: ${CONTEXT_PATH:-}
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:-}
      INTEGRATION_PRODUCTS: ${INTEGRATION_PRODUCTS:-}
      INTEGRATION_CAN_PUBLISH: ${INTEGRATION_CAN_PUBLISH:-false}
      FILE_STORAGE: /data/files
      AA_PASSWORD: ${AA_PASSWORD:?set AA_PASSWORD}
      LEADER_PASSWORD: ${LEADER_PASSWORD:-}
      QUALITY_PASSWORD: ${QUALITY_PASSWORD:-}
      PRODUCT_PASSWORD: ${PRODUCT_PASSWORD:-}
      PRODUCT_SCOPE: ${PRODUCT_SCOPE:-P06}
    volumes:
      - review-files:/data/files
    depends_on:
      db:
        condition: service_healthy
volumes:
  review-db:
  review-files:
